# $schema: https://git.sr.ht/~johnhamelink/hass-json-schema/blob/main/json-schemas/blueprint-automation.json
blueprint:
  domain: automation
  name: Notificaties
  input:
    message:
      name: "Bericht"
      selector: 
        text: 
    notify_vincent:
      name: Meld aan Vincent
      selector: 
        boolean: 
    notify_chris:
      name: Meld aan Christine
      selector: 
        boolean: 
    confirm_action:
      name: Uitvoeren actie
      selector: 
        text:
      default: Uitvoeren
    trigger:
      name: "trigger"
      selector: 
        trigger:
    actie:
      name: "Actie"
      description: "Actie om uit te voeren bij bevestiging"
      selector: 
        action:
          
  
triggers: 
  - triggers: !input trigger


actions: 
 - if:
     - !input notify_vincent
   then:
   - action: notify.mobile_app_iphone
     data:
       message: !input message
       data:
         actions:
           - action: "{{ 'CONFIRM_' ~ context.id }}"
             title: !input confirm_action
 - if:
     - !input notify_chris
   then:
   - action: notify.mobile_app_iphone_christine
     data:
       message: !input message
       data:
         actions:
           - action: "{{ 'CONFIRM_' ~ context.id }}"
             title: !input confirm_action
 - wait_for_trigger: 
   - trigger: event
     event_type: mobile_app_notification_action
     event_data:
      action: "{{ 'CONFIRM_' ~ context.id }}"
 - sequence: !input actie:
