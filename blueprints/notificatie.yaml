# $schema: https://git.sr.ht/~johnhamelink/hass-json-schema/blob/main/json-schemas/blueprint-automation.json
blueprint:
  domain: automation
  name: Notificaties
  input:
    message:
      name: "Bericht"
      selector: 
        text: 
    confirm_action:
      name: Uitvoeren actie
      selector: 
        text:
      default: Uitvoeren
    trigger:
      name: "trigger"
      selector: 
        trigger:
    actie:
      name: "Actie"
      description: "Actie om uit te voeren bij bevestiging"
      selector: 
        action:
          
  
triggers: 
  - triggers: !input trigger
  - trigger: event
    event_type: mobile_app_notification_action
    id: event
    event_data:
      action: "{{ 'CONFIRM_' ~ context.id }}"


actions: 
 - if: 
       - condition: trigger
         id: event
   then: !input actie
   else:
     - action: notify.mobile_app_iphone
       data:
         message: !input message
         data:
           actions:
            - action: "{{ 'CONFIRM_' ~ context.id }}"
              title: !input confirm_action

  
